name: One-time chatbot state fix

on:
  push:
    paths:
      - .github/workflows/one-time-chat-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix chatbot navigation state'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ui/streamlit_app.py')
          text = path.read_text(encoding='utf-8')

          old_go = '''def go(page: str) -> None:\n    st.session_state.page = page\n    st.rerun()'''
          new_go = '''def go(page: str) -> None:\n    # Navigation must always close the Hive AI dialog so a previous\n    # chat session cannot appear when moving to another page.\n    st.session_state.chat_open = False\n    st.session_state.page = page\n    st.rerun()'''

          if old_go not in text:
              raise SystemExit('Expected go() block was not found; no changes made.')
          text = text.replace(old_go, new_go, 1)

          old_ask = '''            if st.button("💬 Ask Hive AI", key="toggle_chat"):\n                st.session_state.chat_open = True'''
          new_ask = '''            if st.button("💬 Ask Hive AI", key="toggle_chat"):\n                st.session_state.chat_open = True\n                st.rerun()'''

          if old_ask not in text:
              raise SystemExit('Expected Ask Hive AI block was not found; no changes made.')
          text = text.replace(old_ask, new_ask, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/streamlit_app.py
          git rm .github/workflows/one-time-chat-fix.yml
          git commit -m "Fix chatbot navigation state"
          git push
